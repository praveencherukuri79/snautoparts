<div class="empty-state">
  <app-icon [name]="icon" size="xl" class="empty-state__icon" />
  
  <h3 class="empty-state__title">{{ title }}</h3>
  
  @if (message) {
    <p class="empty-state__message">{{ message }}</p>
  }
  
  @if (actionLabel) {
    <app-button
      [icon]="actionIcon"
      variant="primary"
      (clicked)="onActionClick()"
    >
      {{ actionLabel }}
    </app-button>
  }
</div>
