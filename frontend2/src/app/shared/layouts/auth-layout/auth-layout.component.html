<div class="auth-layout">
  <!-- Left Side: Hero Image (Hidden on mobile) -->
  <div class="auth-hero">
    <div class="auth-hero__overlay"></div>
    <div class="auth-hero__content">
      <h1 class="text-5xl font-black leading-tight mb-4">
        Performance<br />starts here.
      </h1>
      <p class="text-lg text-[var(--color-text-muted)] max-w-md mb-8">
        Join over 50,000 gearheads who trust SN Auto Parts for their restoration and performance needs.
      </p>
      <div class="flex gap-6">
        <div class="flex items-center gap-2 text-sm text-[var(--color-text-muted)]">
          <span class="material-symbols-outlined text-[var(--color-primary)]">verified</span>
          Quality Guaranteed
        </div>
        <div class="flex items-center gap-2 text-sm text-[var(--color-text-muted)]">
          <span class="material-symbols-outlined text-[var(--color-primary)]">local_shipping</span>
          Fast Shipping
        </div>
      </div>
    </div>
  </div>

  <!-- Right Side: Auth Content -->
  <div class="auth-content">
    <!-- Header -->
    <header class="flex justify-between items-center p-4 lg:px-10 border-b border-[var(--color-border)]">
      <a routerLink="/" class="flex items-center gap-2 no-underline text-[var(--color-text)]">
        <span class="material-symbols-outlined text-[32px] text-[var(--color-primary)]">directions_car</span>
        <span class="text-xl font-bold">SN Auto Parts</span>
      </a>
      <a routerLink="/" class="auth-back-link">
        <span class="material-symbols-outlined text-[20px]">arrow_back</span>
        Return to Shop
      </a>
    </header>

    <!-- Form Container -->
    <main class="flex-1 flex items-center justify-center p-6 lg:p-10">
      <router-outlet></router-outlet>
    </main>

    <!-- Footer -->
    <footer class="flex justify-center gap-6 p-6 border-t border-[var(--color-border)]">
      <a href="#" class="text-xs text-[var(--color-text-muted)] hover:text-[var(--color-text)]">Privacy Policy</a>
      <a href="#" class="text-xs text-[var(--color-text-muted)] hover:text-[var(--color-text)]">Terms of Service</a>
    </footer>
  </div>
</div>
