<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SN Auto Parts - Login</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Noto+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Config -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0d7ff2",
                        "primary-dark": "#0b6bcb",
                        "background-light": "#f5f7f8",
                        "background-dark": "#101922",
                        "surface-dark": "#161e27",
                        "border-dark": "#283039",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"],
                        "body": ["Noto Sans", "sans-serif"],
                    },
                    borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "2xl": "1rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body {
            font-family: "Space Grotesk", sans-serif;
        }
        .form-input::placeholder {
            color: #64748b;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-white overflow-x-hidden flex flex-col min-h-screen">
<!-- Top Navbar -->
<header class="fixed top-0 left-0 right-0 z-50 flex items-center justify-between whitespace-nowrap border-b border-solid border-b-border-dark bg-background-dark/95 backdrop-blur-md px-4 py-3 lg:px-10">
<div class="flex items-center gap-4 text-white">
<div class="size-8 text-primary">
<svg class="w-full h-full" fill="none" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<g clip-path="url(#clip0_6_319)">
<path d="M8.57829 8.57829C5.52816 11.6284 3.451 15.5145 2.60947 19.7452C1.76794 23.9758 2.19984 28.361 3.85056 32.3462C5.50128 36.3314 8.29667 39.7376 11.8832 42.134C15.4698 44.5305 19.6865 45.8096 24 45.8096C28.3135 45.8096 32.5302 44.5305 36.1168 42.134C39.7033 39.7375 42.4987 36.3314 44.1494 32.3462C45.8002 28.361 46.2321 23.9758 45.3905 19.7452C44.549 15.5145 42.4718 11.6284 39.4217 8.57829L24 24L8.57829 8.57829Z" fill="currentColor"></path>
</g>
<defs>
<clippath id="clip0_6_319"><rect fill="white" height="48" width="48"></rect></clippath>
</defs>
</svg>
</div>
<h2 class="text-white text-xl font-bold leading-tight tracking-[-0.015em] hidden sm:block">SN Auto Parts</h2>
</div>
<div class="flex flex-1 justify-end gap-8">
<div class="hidden md:flex items-center gap-9">
<a class="text-white text-sm font-medium leading-normal hover:text-primary transition-colors" href="#">Shop</a>
<a class="text-white text-sm font-medium leading-normal hover:text-primary transition-colors" href="#">Deals</a>
<a class="text-white text-sm font-medium leading-normal hover:text-primary transition-colors" href="#">Support</a>
</div>
<button class="flex min-w-[84px] cursor-pointer items-center justify-center overflow-hidden rounded h-10 px-6 bg-surface-dark border border-border-dark text-white text-sm font-bold leading-normal hover:bg-border-dark transition-colors">
<span class="truncate">Register</span>
</button>
</div>
</header>
<!-- Main Content with Split Layout Background -->
<main class="relative flex-grow flex items-center justify-center pt-20 pb-10 px-4">
<!-- Background Image & Overlay -->
<div class="absolute inset-0 w-full h-full z-0">
<img alt="Dark silhouette of a modern sports car highlighting sleek curves and automotive design" class="w-full h-full object-cover opacity-40" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD6KhBxM54QBSCOAzvr4K2xoT6fQDztLlvP_w_I27mZ5ImghqRDIEL32sPQr4MBnZZENuScJQ420qdvXy9aKAkuzgq3wTCfZ95CMVA8xj-1tkDH9UnV5qLagwkEGJYyz7phbDTPy_e1UL5ObcUEtYZWg97seTQi0qt1jlt00lBmSxyj3l1hVku3RO3CvAjkjvXUQk3vycZJq3WqWdQGJQDwOl8_cm-m6dl-kfxmFei-9BCRMNerM87uWIgQISRDER_4D-RBw6MGtTvl"/>
<div class="absolute inset-0 bg-gradient-to-t from-background-dark via-background-dark/90 to-background-dark/70"></div>
<!-- Abstract tech overlay -->
<div class="absolute inset-0 opacity-10" style="background-image: radial-gradient(#0d7ff2 1px, transparent 1px); background-size: 32px 32px;"></div>
</div>
<!-- Login Card -->
<div class="relative z-10 w-full max-w-[480px] flex flex-col">
<!-- Card Container -->
<div class="bg-surface-dark/95 backdrop-blur-sm border border-border-dark rounded-xl shadow-2xl overflow-hidden p-8 sm:p-10">
<!-- Heading -->
<div class="mb-8 text-center sm:text-left">
<div class="inline-flex items-center justify-center size-12 rounded-full bg-primary/10 text-primary mb-4 sm:hidden">
<span class="material-symbols-outlined text-2xl">garage_home</span>
</div>
<h1 class="text-white tracking-tight text-[32px] font-bold leading-tight mb-2">Welcome Back</h1>
<p class="text-[#9cabba] text-sm font-normal leading-relaxed">Sign in to access your garage, track orders, and manage your parts inventory.</p>
</div>
<!-- Form -->
<form action="#" class="flex flex-col gap-5">
<!-- Email Field -->
<label class="flex flex-col gap-2">
<span class="text-white text-sm font-medium leading-normal">Email or Username</span>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-[#9cabba]">
<span class="material-symbols-outlined text-[20px]">person</span>
</span>
<input class="form-input flex w-full min-w-0 resize-none overflow-hidden rounded-lg text-white placeholder:text-[#64748b] bg-[#101922] border border-[#283039] focus:border-primary focus:ring-1 focus:ring-primary h-12 pl-11 pr-4 text-base font-normal transition-all" placeholder="Enter your email" type="text"/>
</div>
</label>
<!-- Password Field -->
<label class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<span class="text-white text-sm font-medium leading-normal">Password</span>
</div>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-[#9cabba]">
<span class="material-symbols-outlined text-[20px]">lock</span>
</span>
<input class="form-input flex w-full min-w-0 resize-none overflow-hidden rounded-lg text-white placeholder:text-[#64748b] bg-[#101922] border border-[#283039] focus:border-primary focus:ring-1 focus:ring-primary h-12 pl-11 pr-4 text-base font-normal transition-all" placeholder="Enter your password" type="password"/>
</div>
</label>
<!-- Forgot Password Link -->
<div class="flex justify-end">
<a class="text-primary hover:text-primary-dark text-sm font-medium leading-normal transition-colors" href="#">Forgot Password?</a>
</div>
<!-- Login Button -->
<button class="flex w-full cursor-pointer items-center justify-center rounded-lg h-12 px-4 bg-primary hover:bg-primary-dark text-white text-base font-bold leading-normal tracking-wide shadow-[0_0_20px_rgba(13,127,242,0.2)] hover:shadow-[0_0_25px_rgba(13,127,242,0.4)] transition-all duration-300 mt-2" type="button">
                        Secure Login
                    </button>
<!-- Divider -->
<div class="relative flex py-2 items-center">
<div class="flex-grow border-t border-[#283039]"></div>
<span class="flex-shrink mx-4 text-[#9cabba] text-xs">OR CONTINUE WITH</span>
<div class="flex-grow border-t border-[#283039]"></div>
</div>
<!-- Social Login / Register Alternative -->
<div class="grid grid-cols-2 gap-3">
<button class="flex items-center justify-center gap-2 rounded-lg h-10 px-4 bg-[#283039] hover:bg-[#343e49] text-white text-sm font-medium transition-colors border border-transparent hover:border-[#4b5563]" type="button">
<svg class="w-5 h-5" fill="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path></svg>
<span>Google</span>
</button>
<button class="flex items-center justify-center gap-2 rounded-lg h-10 px-4 bg-[#283039] hover:bg-[#343e49] text-white text-sm font-medium transition-colors border border-transparent hover:border-[#4b5563]" type="button">
<span class="material-symbols-outlined text-[20px]">mail</span>
<span>SSO</span>
</button>
</div>
</form>
</div>
<!-- Bottom CTA -->
<div class="mt-6 text-center">
<p class="text-[#9cabba] text-sm">
                    New to SN Auto Parts? 
                    <a class="text-white hover:text-primary font-bold underline decoration-primary/50 underline-offset-4 decoration-2 transition-all" href="#">Create an account</a>
</p>
</div>
<!-- Trust Badges (Optional but fits "Trustworthy" vibe) -->
<div class="mt-8 flex justify-center gap-6 opacity-40 grayscale">
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-lg text-white">lock</span>
<span class="text-xs font-medium text-white">SSL Secured</span>
</div>
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-lg text-white">verified_user</span>
<span class="text-xs font-medium text-white">Buyer Protection</span>
</div>
</div>
</div>
</main>
</body></html>
