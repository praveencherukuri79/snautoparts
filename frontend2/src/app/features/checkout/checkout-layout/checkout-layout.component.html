<div class="checkout-layout">
  <header class="checkout-header">
    <a routerLink="/" class="logo">
      <span class="logo-text">SN Auto Parts</span>
    </a>
    <div class="secure-badge">
      <mat-icon>lock</mat-icon>
      <span>Secure Checkout</span>
    </div>
  </header>

  <div class="checkout-container">
    <div class="checkout-steps">
      @for (step of steps; track step.path; let i = $index) {
        <div 
          class="step" 
          [class.step--active]="i === currentStepIndex"
          [class.step--completed]="i < currentStepIndex"
        >
          <div class="step-indicator">
            @if (i < currentStepIndex) {
              <mat-icon>check</mat-icon>
            } @else {
              {{ i + 1 }}
            }
          </div>
          <span class="step-label">{{ step.label }}</span>
        </div>
        @if (i < steps.length - 1) {
          <div class="step-connector" [class.step-connector--completed]="i < currentStepIndex"></div>
        }
      }
    </div>

    <div class="checkout-content">
      <router-outlet />
    </div>
  </div>
</div>
