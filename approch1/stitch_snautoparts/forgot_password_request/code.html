                    colors: {
                        "primary": "#0d7ff2",
                        "background-light": "#f5f7f8",
                        "background-dark": "#101922",
                        "surface-dark": "#1b232d",
                        "surface-border": "#2d3748",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"],
                        "body": ["Noto Sans", "sans-serif"],
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar for a sleeker look */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #111418;
        }
        ::-webkit-scrollbar-thumb {
            background: #283039;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3b4754;
        }
        
        .automotive-bg {
            background-color: #101922;
            background-image: radial-gradient(at 0% 0%, rgba(13, 127, 242, 0.08) 0px, transparent 50%),
                              radial-gradient(at 100% 100%, rgba(13, 127, 242, 0.05) 0px, transparent 50%);
        }

<body class="automotive-bg min-h-screen flex flex-col font-display text-white selection:bg-primary/30">
<!-- Top Navigation -->
<header class="w-full border-b border-surface-border bg-background-dark/90 backdrop-blur-md sticky top-0 z-50">
<div class="max-w-[1280px] mx-auto px-6 h-16 flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="size-8 text-primary">
<svg fill="currentColor" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path d="M8.57829 8.57829C5.52816 11.6284 3.451 15.5145 2.60947 19.7452C1.76794 23.9758 2.19984 28.361 3.85056 32.3462C5.50128 36.3314 8.29667 39.7376 11.8832 42.134C15.4698 44.5305 19.6865 45.8096 24 45.8096C28.3135 45.8096 32.5302 44.5305 36.1168 42.134C39.7033 39.7375 42.4987 36.3314 44.1494 32.3462C45.8002 28.361 46.2321 23.9758 45.3905 19.7452C44.549 15.5145 42.4718 11.6284 39.4217 8.57829L24 24L8.57829 8.57829Z"></path>
</svg>
</div>
<h2 class="text-white text-xl font-bold tracking-tight">SN Auto Parts</h2>
</div>
<a class="hidden sm:flex items-center justify-center h-9 px-4 rounded bg-surface-border/50 hover:bg-surface-border text-sm font-bold text-white transition-colors duration-200" href="#">
                Log In
            </a>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-grow flex items-center justify-center p-4 relative overflow-hidden">
<!-- Abstract background accent -->
<div class="absolute inset-0 z-0 opacity-20 pointer-events-none" data-alt="Abstract dark carbon fiber texture background" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBLFusRA_-FfOavgwDH_j1tOKx-EdjNn0CjasYMzTeywnZQvJScJcnAHXjNCGruvrptJ66VLUvyQqZPW4-9BmHqEtAtSP23LzoF4wZMTAPBg_DhwJivPvJqzB6AY6nF8L1XmycOsM6k8-ftFpTJm4RKjL7MY6bq3rTFFsn3MXZWtioG2L9ngNMC6J71rKkO-Ps1slmf5rAIzL5yq_FYMOMYwagQv9n18DcxTkkfI3CYPqF41-xN1D3PsuQhPA39YxummcdGxrViX2QH'); background-size: cover; background-position: center;">
</div>
<!-- Card Container -->
<div class="relative z-10 w-full max-w-[480px] bg-surface-dark border border-surface-border rounded-xl shadow-2xl overflow-hidden flex flex-col">
<!-- Card Header Image/Graphic (Optional) -->
<div class="h-2 bg-primary w-full"></div>
<div class="p-8 sm:p-10 flex flex-col items-center text-center">
<!-- Icon -->
<div class="size-14 rounded-full bg-primary/10 flex items-center justify-center mb-6 text-primary border border-primary/20">
<span class="material-symbols-outlined text-3xl">lock_reset</span>
</div>
<!-- Headline -->
<h1 class="text-white text-3xl font-bold leading-tight mb-3">Forgot your password?</h1>
<!-- Body Text -->
<p class="text-[#9cabba] text-base font-normal leading-relaxed mb-8">
                    Don't worry, it happens. Enter the email associated with your account and we’ll send you a recovery link.
                </p>
<!-- Form -->
<form class="w-full flex flex-col gap-6" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="text-left w-full">
<label class="block text-white text-sm font-medium mb-2 pl-1" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-[#9cabba]">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
<input class="w-full h-12 pl-11 pr-4 rounded bg-[#111418] border border-surface-border text-white placeholder:text-[#586572] focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-200 text-base" id="email" name="email" placeholder="mechanic@example.com" required="" type="email"/>
</div>
</div>
<!-- Submit Button -->
<button class="w-full h-12 flex items-center justify-center rounded bg-primary hover:bg-primary/90 text-white text-base font-bold tracking-wide transition-colors duration-200 shadow-[0_0_15px_rgba(13,127,242,0.3)] hover:shadow-[0_0_20px_rgba(13,127,242,0.5)]">
                        Send Reset Link
                    </button>
</form>
<!-- Back to Login -->
<div class="mt-8 pt-6 border-t border-surface-border w-full">
<a class="inline-flex items-center gap-2 text-sm font-bold text-[#9cabba] hover:text-white transition-colors duration-200 group" href="#">
<span class="material-symbols-outlined text-lg transition-transform group-hover:-translate-x-1">arrow_back</span>
                        Back to Login
                    </a>
</div>
</div>
</div>
</main>
<!-- Simple Footer -->
<footer class="w-full py-6 text-center text-[#586572] text-sm z-10">
<p>© 2023 SN Auto Parts. All rights reserved.</p>
</footer>
