openapi: 3.0.3
info:
  title: SN Auto Parts API
  description: |
    Feature-config driven e-commerce API for auto parts.
    
    ## Authentication
    All authenticated endpoints require a session token passed via:
    - Cookie: `auth-token=<token>`
    - Header: `Authorization: Bearer <token>`
    
    ## Authorization
    APIs are generic - authorization is determined by the authenticated user's role 
    and feature configuration. The same endpoint may return different data or 
    permissions based on the user's role.
    
    ## Feature-Based Access
    Each endpoint requires specific features to be enabled in the user's role configuration.
    If a user lacks the required feature, they receive a 403 Forbidden response.
  version: 1.0.0
  contact:
    name: SN Auto Parts
    email: support@snautoparts.com

servers:
  - url: http://localhost:3000/api/v1
    description: Development server
  - url: https://api.snautoparts.com/api/v1
    description: Production server

tags:
  - name: Auth
    description: Authentication and session management
  - name: Catalog
    description: Public product catalog
  - name: Cart
    description: Shopping cart operations
  - name: Checkout
    description: Checkout and payment
  - name: Orders
    description: Order management
  - name: Products
    description: Product management
  - name: Inventory
    description: Inventory management
  - name: Dropship
    description: Drop-shipping and affiliates
  - name: Users
    description: User management
  - name: Profile
    description: User profile and addresses
  - name: Settings
    description: System settings
  - name: Audit
    description: Audit logging
  - name: Reports
    description: Analytics and reports

paths:
  # ============================================
  # AUTH ENDPOINTS
  # ============================================
  /auth/register:
    post:
      tags: [Auth]
      summary: Register new user
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/login:
    post:
      tags: [Auth]
      summary: User login
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Auth]
      summary: User logout
      operationId: logout
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current user
      operationId: getCurrentUser
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Current user data
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DataWrapper'
                  - properties:
                      data:
                        $ref: '#/components/schemas/User'

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request password reset
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Password reset email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password with token
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /auth/feature-config:
    get:
      tags: [Auth]
      summary: Get feature configuration for user's role
      operationId: getFeatureConfig
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Feature configuration
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DataWrapper'
                  - properties:
                      data:
                        $ref: '#/components/schemas/FeatureConfig'

  # ============================================
  # CATALOG ENDPOINTS
  # ============================================
  /catalog/categories:
    get:
      tags: [Catalog]
      summary: List all categories
      operationId: listCategories
      responses:
        '200':
          description: List of categories
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DataWrapper'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Category'

  /catalog/categories/{slug}:
    get:
      tags: [Catalog]
      summary: Get category by slug
      operationId: getCategoryBySlug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Category details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DataWrapper'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Category'
        '404':
          $ref: '#/components/responses/NotFound'

  /catalog/brands:
    get:
      tags: [Catalog]
      summary: List all brands
      operationId: listBrands
      responses:
        '200':
          description: List of brands
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DataWrapper'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Brand'

  /catalog/products:
    get:
      tags: [Catalog]
      summary: List products with filters
      operationId: listProducts
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: categoryId
          in: query
          schema:
            type: string
        - name: brandId
          in: query
          schema:
            type: string
        - name: minPrice
          in: query
          schema:
            type: number
        - name: maxPrice
          in: query
          schema:
            type: number
        - name: inStock
          in: query
          schema:
            type: boolean
        - name: featured
          in: query
          schema:
            type: boolean
        - name: search
          in: query
          schema:
            type: string
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [price_asc, price_desc, name_asc, name_desc, newest, bestselling]
      responses:
        '200':
          description: Paginated list of products
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ProductSummary'

  /catalog/products/featured:
    get:
      tags: [Catalog]
      summary: List featured products
      operationId: listFeaturedProducts
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Featured products
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ProductSummary'

  /catalog/products/{slug}:
    get:
      tags: [Catalog]
      summary: Get product by slug
      operationId: getProductBySlug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DataWrapper'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ProductDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  /catalog/search:
    get:
      tags: [Catalog]
      summary: Search products
      operationId: searchProducts
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ProductSummary'

  /catalog/fitment/makes:
    get:
      tags: [Catalog]
      summary: Get all vehicle makes
      operationId: getFitmentMakes
      responses:
        '200':
          description: List of makes
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DataWrapper'
                  - properties:
                      data:
                        type: array
                        items:
                          type: string

  /catalog/fitment/models:
    get:
      tags: [Catalog]
      summary: Get models for a make
      operationId: getFitmentModels
      parameters:
        - name: make
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of models
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DataWrapper'
                  - properties:
                      data:
                        type: array
                        items:
                          type: string

  /catalog/fitment/years:
    get:
      tags: [Catalog]
      summary: Get years for make/model
      operationId: getFitmentYears
      parameters:
        - name: make
          in: query
          required: true
          schema:
            type: string
        - name: model
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of years
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DataWrapper'
                  - properties:
                      data:
                        type: array
                        items:
                          type: integer

  /catalog/fitment/search:
    get:
      tags: [Catalog]
      summary: Search products by fitment
      operationId: searchByFitment
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: integer
        - name: make
          in: query
          required: true
          schema:
            type: string
        - name: model
          in: query
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Products matching fitment
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ProductSummary'

  # ============================================
  # CART ENDPOINTS
  # ============================================
  /cart:
    get:
      tags: [Cart]
      summary: Get cart
      operationId: getCart
      security:
        - sessionAuth: []
      x-feature-required: cart.view
      responses:
        '200':
          description: Cart contents
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DataWrapper'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Cart'
    delete:
      tags: [Cart]
      summary: Clear cart
      operationId: clearCart
      security:
        - sessionAuth: []
      x-feature-required: cart.modify
      responses:
        '200':
          description: Cart cleared
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DataWrapper'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Cart'

  /cart/items:
    post:
      tags: [Cart]
      summary: Add item to cart
      operationId: addCartItem
      security:
        - sessionAuth: []
      x-feature-required: cart.modify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCartItemRequest'
      responses:
        '200':
          description: Item added
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DataWrapper'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Cart'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /cart/items/{id}:
    patch:
      tags: [Cart]
      summary: Update cart item quantity
      operationId: updateCartItem
      security:
        - sessionAuth: []
      x-feature-required: cart.modify
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCartItemRequest'
      responses:
        '200':
          description: Item updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DataWrapper'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Cart'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Cart]
      summary: Remove item from cart
      operationId: removeCartItem
      security:
        - sessionAuth: []
      x-feature-required: cart.modify
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Item removed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DataWrapper'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Cart'

  /cart/count:
    get:
      tags: [Cart]
      summary: Get cart item count
      operationId: getCartCount
      security:
        - sessionAuth: []
      x-feature-required: cart.view
      responses:
        '200':
          description: Cart count
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DataWrapper'
                  - properties:
                      data:
                        type: object
                        properties:
                          count:
                            type: integer

  # ============================================
  # CHECKOUT ENDPOINTS
  # ============================================
  /checkout/shipping-methods:
    get:
      tags: [Checkout]
      summary: Get available shipping methods
      operationId: getShippingMethods
      security:
        - sessionAuth: []
      x-feature-required: cart.checkout
      responses:
        '200':
          description: Shipping methods
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DataWrapper'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ShippingMethod'

  /checkout/payment-intent:
    post:
      tags: [Checkout]
      summary: Create Stripe payment intent
      operationId: createPaymentIntent
      security:
        - sessionAuth: []
      x-feature-required: cart.checkout
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                idempotencyKey:
                  type: string
      responses:
        '200':
          description: Payment intent created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DataWrapper'
                  - properties:
                      data:
                        $ref: '#/components/schemas/PaymentIntent'
        '400':
          $ref: '#/components/responses/BadRequest'

  /checkout/orders:
    post:
      tags: [Checkout]
      summary: Create order
      operationId: createOrder
      security:
        - sessionAuth: []
      x-feature-required: cart.checkout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DataWrapper'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  # ============================================
  # ORDERS ENDPOINTS
  # ============================================
  /orders:
    get:
      tags: [Orders]
      summary: List orders
      description: |
        Returns orders based on user's role:
        - CUSTOMER: Only own orders (requires orders.viewOwn)
        - MANAGER/ADMIN: All orders (requires orders.viewAll)
      operationId: listOrders
      security:
        - sessionAuth: []
      x-feature-required: orders.viewOwn|orders.viewAll
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - name: search
          in: query
          schema:
            type: string
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date-time
        - name: dateTo
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: List of orders
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/OrderSummary'

  /orders/{id}:
    get:
      tags: [Orders]
      summary: Get order details
      operationId: getOrderById
      security:
        - sessionAuth: []
      x-feature-required: orders.viewOwn|orders.viewAll
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DataWrapper'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFound'

  /orders/{id}/status:
    patch:
      tags: [Orders]
      summary: Update order status
      operationId: updateOrderStatus
      security:
        - sessionAuth: []
      x-feature-required: orders.updateStatus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderStatusRequest'
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DataWrapper'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFound'

  /orders/{id}/cancel:
    post:
      tags: [Orders]
      summary: Cancel order
      operationId: cancelOrder
      security:
        - sessionAuth: []
      x-feature-required: orders.cancel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order cancelled
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DataWrapper'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /orders/statistics:
    get:
      tags: [Orders]
      summary: Get order statistics
      operationId: getOrderStatistics
      security:
        - sessionAuth: []
      x-feature-required: orders.viewStatistics
      responses:
        '200':
          description: Order statistics
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DataWrapper'
                  - properties:
                      data:
                        $ref: '#/components/schemas/OrderStatistics'

  /orders/pending-count:
    get:
      tags: [Orders]
      summary: Get pending orders count
      operationId: getPendingOrdersCount
      security:
        - sessionAuth: []
      x-feature-required: orders.viewAll
      responses:
        '200':
          description: Pending count
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DataWrapper'
                  - properties:
                      data:
                        type: object
                        properties:
                          count:
                            type: integer

  /orders/track/{orderNumber}:
    get:
      tags: [Orders]
      summary: Track order by number (public)
      operationId: trackOrder
      parameters:
        - name: orderNumber
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order tracking info
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DataWrapper'
                  - properties:
                      data:
                        $ref: '#/components/schemas/OrderTracking'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================
  # PRODUCTS ENDPOINTS
  # ============================================
  /products:
    get:
      tags: [Products]
      summary: List products (management view)
      operationId: listProductsManagement
      security:
        - sessionAuth: []
      x-feature-required: products.update
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: search
          in: query
          schema:
            type: string
        - name: isActive
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Products list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ProductDetail'
    post:
      tags: [Products]
      summary: Create product
      operationId: createProduct
      security:
        - sessionAuth: []
      x-feature-required: products.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DataWrapper'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ProductDetail'
        '409':
          $ref: '#/components/responses/Conflict'

  /products/{id}:
    get:
      tags: [Products]
      summary: Get product (management view)
      operationId: getProductManagement
      security:
        - sessionAuth: []
      x-feature-required: products.update
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DataWrapper'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ProductDetail'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Products]
      summary: Update product
      operationId: updateProduct
      security:
        - sessionAuth: []
      x-feature-required: products.update
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DataWrapper'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ProductDetail'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Products]
      summary: Delete product
      operationId: deleteProduct
      security:
        - sessionAuth: []
      x-feature-required: products.delete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '404':
