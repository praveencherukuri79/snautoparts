                type: number
              itemCount:
                type: integer

    GmvReport:
      type: object
      properties:
        totalGmv:
          type: number
        inventoryGmv:
          type: number
        dropshipGmv:
          type: number
        orderCount:
          type: integer
        period:
          type: string
        data:
          type: array
          items:
            type: object
            properties:
              date:
