<div class="bg-surface rounded-2xl border border-border p-6">
  <h2 class="text-xl font-semibold text-text mb-6">
    {{ content.checkout.payment.title }}
  </h2>

  <form [formGroup]="paymentForm" class="space-y-6">
    <!-- Card Number -->
    <div>
      <label class="block text-sm font-medium text-text-secondary mb-1">
        {{ content.checkout.payment.cardNumber }} *
      </label>
      <div class="relative">
        <input
          type="text"
          [value]="displayCardNumber"
          (input)="formatCardNumber($event)"
          placeholder="1234 5678 9012 3456"
          maxlength="19"
          class="w-full px-4 py-3 rounded-lg ui-input pr-12"
        >
        <div class="absolute right-3 top-1/2 -translate-y-1/2 flex gap-1">
          <app-icon name="credit_card" [size]="24" class="text-text-muted"></app-icon>
        </div>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <!-- Expiry -->
      <div>
        <label class="block text-sm font-medium text-text-secondary mb-1">
          {{ content.checkout.payment.expiry }} *
        </label>
        <input
          type="text"
          formControlName="expiry"
          (input)="formatExpiry($event)"
          placeholder="MM/YY"
          maxlength="5"
          class="w-full px-4 py-3 rounded-lg ui-input"
        >
      </div>

      <!-- CVC -->
      <div>
        <label class="block text-sm font-medium text-text-secondary mb-1">
          {{ content.checkout.payment.cvc }} *
        </label>
        <input
          type="text"
          formControlName="cvc"
          placeholder="123"
          maxlength="4"
          class="w-full px-4 py-3 rounded-lg ui-input"
        >
      </div>
    </div>

    <!-- Billing Address -->
    <div class="pt-4 border-t border-border">
      <h3 class="text-sm font-medium text-text mb-3">
        {{ content.checkout.payment.billingAddress }}
      </h3>
      <label class="flex items-center gap-3 cursor-pointer">
        <input
          type="checkbox"
          formControlName="sameAsShipping"
          class="w-4 h-4 text-primary border-border-strong rounded focus:ring-primary"
        >
        <span class="text-sm text-text-secondary">
          {{ content.checkout.payment.sameAsShipping }}
        </span>
      </label>
    </div>

    <!-- Security Notice -->
    <div class="flex items-center gap-2 p-4 bg-success-bg rounded-lg">
      <app-icon name="lock" [size]="20" class="text-success-text"></app-icon>
      <span class="text-sm text-success-text">
        {{ content.checkout.payment.securePayment }}
      </span>
    </div>
  </form>

  <!-- Navigation Buttons -->
  <div class="mt-8 flex gap-4">
    <button
      (click)="goBack()"
      type="button"
      class="btn btn-secondary btn-lg flex-1"
      [disabled]="processing()">
      <app-icon name="arrow_back" [size]="18"></app-icon>
      {{ content.common.back }}
    </button>
    <button
      (click)="continue()"
      type="button"
      class="btn btn-primary btn-lg flex-1"
      [disabled]="!paymentForm.valid || processing()">
      @if (processing()) {
        <div class="spinner w-5 h-5"></div>
      }
      {{ content.checkout.payment.continue }}
      <app-icon name="arrow_forward" [size]="18"></app-icon>
    </button>
  </div>
</div>
