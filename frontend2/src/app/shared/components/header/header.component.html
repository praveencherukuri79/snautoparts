<header class="header">
  <div class="flex items-center justify-between gap-6 max-w-[1280px] mx-auto px-6 h-20">
    <!-- Logo -->
    <a routerLink="/" class="flex items-center gap-2 no-underline text-white flex-shrink-0">
      <span class="header__brand-icon material-symbols-outlined">directions_car</span>
      <span class="text-xl font-bold tracking-tight">SN Auto Parts</span>
    </a>

    <!-- Search Bar -->
    <div class="header__search">
      <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-[var(--color-text-muted)] pointer-events-none">search</span>
      <input
        type="text"
        class="header__search-input"
        placeholder="Search parts by name, SKU, or vehicle..."
      />
    </div>

    <!-- Navigation -->
    <nav class="hidden lg:flex items-center gap-6">
      <a routerLink="/" routerLinkActive="text-white" [routerLinkActiveOptions]="{exact: true}"
         class="text-sm font-medium text-[var(--color-text-muted)] hover:text-white transition-colors">
        Home
      </a>
      <a routerLink="/products" routerLinkActive="text-white"
         class="text-sm font-medium text-[var(--color-text-muted)] hover:text-white transition-colors">
        Products
      </a>
      <a routerLink="/categories" routerLinkActive="text-white"
         class="text-sm font-medium text-[var(--color-text-muted)] hover:text-white transition-colors">
        Categories
      </a>
    </nav>

    <!-- Actions -->
    <div class="flex items-center gap-2 pl-4 border-l border-white/10">
      <!-- Cart -->
      <a routerLink="/cart" class="header__action-btn" [matBadge]="cartItemCount()" [matBadgeHidden]="!cartItemCount()">
        <span class="material-symbols-outlined">shopping_cart</span>
      </a>

      <!-- User Menu -->
      @if (isAuthenticated()) {
        <button class="header__action-btn" [matMenuTriggerFor]="userMenu">
          <span class="material-symbols-outlined">account_circle</span>
        </button>
        <mat-menu #userMenu="matMenu">
          <div class="px-4 py-3">
            <span class="block font-semibold">{{ user()?.firstName }} {{ user()?.lastName }}</span>
            <span class="block text-sm text-[var(--color-text-muted)]">{{ user()?.email }}</span>
          </div>
          <mat-divider></mat-divider>
          @for (item of accountNavItems(); track item.id) {
            <a mat-menu-item [routerLink]="item.route">
              <span class="material-symbols-outlined">{{ item.icon }}</span>
              <span>{{ item.label }}</span>
            </a>
          }
          <mat-divider></mat-divider>
          <button mat-menu-item (click)="logout()">
            <span class="material-symbols-outlined">logout</span>
            <span>Logout</span>
          </button>
        </mat-menu>
      } @else {
        <a routerLink="/login" class="header__action-btn">
          <span class="material-symbols-outlined">account_circle</span>
        </a>
      }
    </div>
  </div>
</header>
