<div class="forgot-password">
  @if (emailSent()) {
    <div class="forgot-password__success">
      <span class="material-symbols-outlined forgot-password__success-icon">mark_email_read</span>
      <h1 class="forgot-password__title">Check Your Email</h1>
      <p class="forgot-password__subtitle">
        We've sent password reset instructions to your email address.
      </p>
      <a routerLink="/login" class="forgot-password__back-link">
        <span class="material-symbols-outlined">arrow_back</span>
        Back to Login
      </a>
    </div>
  } @else {
    <div class="forgot-password__header">
      <h1 class="forgot-password__title">Forgot Password?</h1>
      <p class="forgot-password__subtitle">
        Enter your email address and we'll send you a link to reset your password.
      </p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="forgot-password__form">
      <app-input
        label="Email Address"
        type="email"
        placeholder="name@example.com"
        formControlName="email"
        [error]="emailError"
        autocomplete="email"
      ></app-input>

      <app-button
        variant="primary"
        type="submit"
        [fullWidth]="true"
        [loading]="isLoading()"
        icon="mail"
      >
        Send Reset Link
      </app-button>
    </form>

    <a routerLink="/login" class="forgot-password__back-link">
      <span class="material-symbols-outlined">arrow_back</span>
      Back to Login
    </a>
  }
</div>
