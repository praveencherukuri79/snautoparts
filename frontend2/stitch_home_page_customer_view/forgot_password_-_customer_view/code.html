<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Forgot Password - SN Auto Parts</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f97415",
                        "background-light": "#f8f7f5",
                        "background-dark": "#23170f",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
</head>
<body class="flex flex-col min-h-screen font-display bg-background-light dark:bg-background-dark text-[#181411] dark:text-white antialiased overflow-x-hidden">
<!-- Header -->
<header class="flex items-center justify-between whitespace-nowrap border-b border-solid border-[#3a2e26] bg-[#181411] px-6 lg:px-40 py-3 w-full z-10">
<div class="flex items-center gap-4 text-white">
<div class="size-6 text-primary">
<!-- Logo Icon -->
<svg class="w-full h-full" fill="none" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<g clip-path="url(#clip0_6_319)">
<path d="M8.57829 8.57829C5.52816 11.6284 3.451 15.5145 2.60947 19.7452C1.76794 23.9758 2.19984 28.361 3.85056 32.3462C5.50128 36.3314 8.29667 39.7376 11.8832 42.134C15.4698 44.5305 19.6865 45.8096 24 45.8096C28.3135 45.8096 32.5302 44.5305 36.1168 42.134C39.7033 39.7375 42.4987 36.3314 44.1494 32.3462C45.8002 28.361 46.2321 23.9758 45.3905 19.7452C44.549 15.5145 42.4718 11.6284 39.4217 8.57829L24 24L8.57829 8.57829Z" fill="currentColor"></path>
</g>
<defs>
<clippath id="clip0_6_319"><rect fill="white" height="48" width="48"></rect></clippath>
</defs>
</svg>
</div>
<h2 class="text-white text-lg font-bold leading-tight tracking-[-0.015em]">SN Auto Parts</h2>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col items-center justify-center p-4">
<div class="w-full max-w-[480px] bg-white dark:bg-[#1a120b] rounded-xl shadow-lg border border-[#e6dfdb] dark:border-[#3a2e26] overflow-hidden">
<div class="px-6 py-8 md:px-10 md:py-10 flex flex-col gap-6">
<!-- Page Heading & Description -->
<div class="flex flex-col gap-3 text-center items-center">
<div class="size-14 rounded-full bg-primary/10 flex items-center justify-center mb-1">
<span class="material-symbols-outlined text-primary text-[28px]">lock_reset</span>
</div>
<h1 class="text-[#181411] dark:text-white text-2xl md:text-3xl font-black leading-tight tracking-[-0.033em]">
                        Forgot Your Password?
                    </h1>
<p class="text-[#8c725f] dark:text-[#a08c7a] text-base font-normal leading-normal max-w-xs">
                        Enter your email address below and we'll send you a link to reset your password.
                    </p>
</div>
<!-- Input Form -->
<form class="flex flex-col gap-5 w-full mt-2" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="flex flex-col gap-2">
<label class="text-[#181411] dark:text-[#e6dfdb] text-sm font-medium leading-normal" for="email">
                            Email Address
                        </label>
<div class="relative">
<input class="form-input flex w-full min-w-0 resize-none overflow-hidden rounded-lg text-[#181411] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/20 focus:border-primary border border-[#e6dfdb] dark:border-[#4a3b32] bg-white dark:bg-[#23170f] h-14 placeholder:text-[#8c725f] dark:placeholder:text-[#6e5849] p-[15px] pl-11 text-base font-normal leading-normal transition-all" id="email" placeholder="Enter your email" required="" type="email" value=""/>
<div class="absolute left-4 top-1/2 -translate-y-1/2 flex items-center justify-center pointer-events-none">
<span class="material-symbols-outlined text-[#8c725f] dark:text-[#6e5849]">mail</span>
</div>
</div>
</div>
<!-- Submit Button -->
<button class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 bg-primary hover:bg-[#e0650f] active:bg-[#cc5a0d] transition-colors text-white text-base font-bold leading-normal tracking-[0.015em] shadow-sm">
<span class="truncate">Send Reset Link</span>
</button>
</form>
<!-- Back Link -->
<div class="pt-2 flex justify-center">
<a class="group flex items-center justify-center gap-1.5 text-[#8c725f] dark:text-[#a08c7a] text-sm font-medium leading-normal hover:text-primary dark:hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined text-lg transition-transform group-hover:-translate-x-1">arrow_back</span>
<span>Back to Login</span>
</a>
</div>
</div>
</div>
</main>
<!-- Success Message Toast Example (Positioned relatively for demonstration of style, usually hidden or absolute) -->
<!-- This section is to demonstrate the UI for the success state requested -->
<div class="fixed bottom-6 right-6 max-w-sm w-full animate-pulse pointer-events-none opacity-0">
<div class="bg-green-50 dark:bg-green-900/20 border border-green-200 dark:border-green-800 rounded-lg p-4 shadow-lg flex items-start gap-3">
<span class="material-symbols-outlined text-green-600 dark:text-green-400 mt-0.5">check_circle</span>
<div class="flex flex-col gap-1">
<p class="text-green-800 dark:text-green-200 font-medium text-sm">Check your inbox</p>
<p class="text-green-700 dark:text-green-300 text-sm">If an account with that email exists, a password reset link has been sent.</p>
</div>
</div>
</div>
</body></html>
