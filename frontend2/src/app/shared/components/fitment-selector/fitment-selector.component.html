<div class="fitment-selector">
  <div class="fitment-selector__fields">
    <app-select
      label="Year"
      [options]="years()"
      [control]="yearControl"
      placeholder="Select Year"
      (selectionChange)="onYearChange($event)"
    />

    <app-select
      label="Make"
      [options]="makes()"
      [control]="makeControl"
      placeholder="Select Make"
      (selectionChange)="onMakeChange($event)"
    />

    <app-select
      label="Model"
      [options]="models()"
      [control]="modelControl"
      placeholder="Select Model"
    />
  </div>

  <app-button
    icon="search"
    [disabled]="!isComplete()"
    (clicked)="search()"
    [fullWidth]="true"
    class="md:w-auto"
  >
    Find Parts
  </app-button>
</div>
