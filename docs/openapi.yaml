# ============================================
# COMPONENTS
# ============================================
components:
  securitySchemes:
    sessionAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Session token (also accepted as auth-token cookie)

  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    Success:
      description: Operation successful
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessResponse'
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    # Common Response Wrappers
    DataWrapper:
      type: object
      properties:
        data: {}

    PaginatedResponse:
      type: object
      properties:
        data:
          type: array
          items: {}
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true

    ErrorResponse:
      type: object
      properties:
        statusCode:
          type: integer
        error:
          type: string
        message:
          type: string
        details:
          type: object

    # Auth Schemas
    RegisterRequest:
      type: object
      required: [email, password, firstName, lastName]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        phone:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/User'
            token:
              type: string

    # User Schemas
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        role:
          type: string
          enum: [CUSTOMER, MANAGER, ADMIN]
        image:
          type: string
        createdAt:
          type: string
          format: date-time

    CreateUserRequest:
      type: object
      required: [email, password, firstName, lastName]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
          enum: [CUSTOMER, MANAGER, ADMIN]

    UpdateProfileRequest:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string

    # Feature Config
    FeatureConfig:
      type: object
      properties:
        role:
          type: string
        version:
          type: integer
        features:
          type: object
        navigation:
          type: object
          properties:
            primary:
              type: array
              items:
                $ref: '#/components/schemas/NavigationItem'
            secondary:
              type: array
              items:
                $ref: '#/components/schemas/NavigationItem'
            account:
              type: array
              items:
                $ref: '#/components/schemas/NavigationItem'
        ui:
          type: object

    NavigationItem:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        icon:
          type: string
        route:
          type: string
        children:
          type: array
          items:
            $ref: '#/components/schemas/NavigationItem'
        badge:
          type: object
          properties:
            type:
              type: string
              enum: [count, dot]
            source:
              type: string

    # Catalog Schemas
    Category:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        imageUrl:
          type: string
        parentId:
          type: string
        sortOrder:
          type: integer
        isActive:
          type: boolean
        children:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        _count:
          type: object
          properties:
            products:
              type: integer

    Brand:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        logoUrl:
          type: string
        description:
          type: string
        isActive:
          type: boolean

    ProductSummary:
      type: object
      properties:
        id:
          type: string
        sku:
          type: string
        name:
          type: string
        slug:
          type: string
        shortDescription:
          type: string
        price:
          type: string
        compareAtPrice:
          type: string
        imageUrl:
          type: string
        stockQuantity:
          type: integer
        isActive:
          type: boolean
        isFeatured:
          type: boolean
        category:
          $ref: '#/components/schemas/Category'
        brand:
          $ref: '#/components/schemas/Brand'

    ProductDetail:
      allOf:
        - $ref: '#/components/schemas/ProductSummary'
        - type: object
          properties:
            description:
              type: string
            costPrice:
              type: string
            images:
              type: array
              items:
                type: string
            weight:
              type: number
            weightUnit:
              type: string
            length:
              type: number
            width:
              type: number
            height:
              type: number
            dimensionUnit:
              type: string
            upc:
              type: string
            lowStockThreshold:
              type: integer
            fulfillmentType:
              type: string
              enum: [INVENTORY, DROPSHIP, MIXED]
            fitments:
              type: array
              items:
                $ref: '#/components/schemas/ProductFitment'

    ProductFitment:
      type: object
      properties:
        id:
          type: string
        yearStart:
          type: integer
        yearEnd:
          type: integer
        make:
          type: string
        model:
          type: string
        submodel:
          type: string
        engine:
          type: string
        notes:
          type: string

    CreateProductRequest:
      type: object
      required: [sku, name, price, categoryId]
      properties:
        sku:
          type: string
        name:
          type: string
        description:
          type: string
        shortDescription:
          type: string
        price:
          type: number
        compareAtPrice:
          type: number
        costPrice:
          type: number
        categoryId:
          type: string
        brandId:
          type: string
        imageUrl:
          type: string
        images:
          type: array
          items:
            type: string
        weight:
          type: number
        stockQuantity:
          type: integer
        lowStockThreshold:
          type: integer
        fulfillmentType:
          type: string
          enum: [INVENTORY, DROPSHIP, MIXED]
        isActive:
          type: boolean
        isFeatured:
          type: boolean

    UpdateProductRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        shortDescription:
          type: string
        price:
          type: number
        compareAtPrice:
          type: number
        costPrice:
          type: number
        categoryId:
          type: string
        brandId:
          type: string
        imageUrl:
          type: string
        images:
          type: array
          items:
            type: string
        weight:
          type: number
        lowStockThreshold:
          type: integer
        fulfillmentType:
          type: string
          enum: [INVENTORY, DROPSHIP, MIXED]
        isActive:
          type: boolean
        isFeatured:
          type: boolean

    CreateFitmentRequest:
      type: object
      required: [yearStart, yearEnd, make, model]
      properties:
        yearStart:
          type: integer
        yearEnd:
          type: integer
        make:
          type: string
        model:
          type: string
        submodel:
          type: string
        engine:
          type: string
        notes:
          type: string

    # Cart Schemas
    Cart:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        subtotal:
          type: number
        itemCount:
          type: integer

    CartItem:
      type: object
      properties:
        id:
          type: string
        productId:
          type: string
        quantity:
          type: integer
        product:
          $ref: '#/components/schemas/ProductSummary'

    AddCartItemRequest:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: string
        quantity:
          type: integer
          minimum: 1

    UpdateCartItemRequest:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 0

    # Checkout Schemas
    ShippingMethod:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        price:
          type: number
        freeThreshold:
          type: number

    PaymentIntent:
      type: object
      properties:
        clientSecret:
          type: string
        paymentIntentId:
          type: string
        amount:
          type: number
        subtotal:
          type: number
        shippingAmount:
          type: number
        taxAmount:
          type: number

    CreateOrderRequest:
      type: object
      required: [shippingMethod]
      properties:
        addressId:
          type: string
        shippingAddress:
          $ref: '#/components/schemas/CreateAddressRequest'
        shippingMethod:
          type: string
        paymentIntentId:
          type: string
        idempotencyKey:
          type: string
        notes:
          type: string

    # Order Schemas
    OrderStatus:
      type: string
      enum: [PENDING, CONFIRMED, PROCESSING, SHIPPED, DELIVERED, CANCELLED, REFUNDED]

    OrderSummary:
      type: object
      properties:
        id:
          type: string
        orderNumber:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
        paymentStatus:
          type: string
        totalAmount:
          type: string
        createdAt:
          type: string
          format: date-time
        user:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            email:
              type: string
        _count:
          type: object
          properties:
            items:
              type: integer

    Order:
      allOf:
        - $ref: '#/components/schemas/OrderSummary'
        - type: object
          properties:
            subtotal:
              type: string
            shippingAmount:
              type: string
            taxAmount:
              type: string
            shippingMethod:
              type: string
            shippingCarrier:
              type: string
            trackingNumber:
              type: string
            notes:
              type: string
            items:
              type: array
              items:
                $ref: '#/components/schemas/OrderItem'
            timeline:
              type: array
              items:
                $ref: '#/components/schemas/OrderTimelineEntry'

    OrderItem:
      type: object
      properties:
        id:
          type: string
        sku:
          type: string
        name:
          type: string
        price:
          type: string
        quantity:
          type: integer
        totalPrice:
          type: string
        product:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            imageUrl:
              type: string
            slug:
              type: string

    OrderTimelineEntry:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
        message:
          type: string
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string

    OrderTracking:
      type: object
      properties:
        orderNumber:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
        shippingCarrier:
          type: string
        trackingNumber:
          type: string
        createdAt:
          type: string
          format: date-time
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/OrderTimelineEntry'

    UpdateOrderStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/OrderStatus'
        trackingNumber:
          type: string
        shippingCarrier:
          type: string
        notes:
          type: string

    OrderStatistics:
      type: object
      properties:
        newOrders:
          type: integer
        pendingShipment:
          type: integer
        todaysVolume:
          type: number
        statusCounts:
          type: object
          additionalProperties:
            type: integer

    # Inventory Schemas
    InventoryItem:
      type: object
      properties:
        id:
          type: string
        sku:
          type: string
        name:
          type: string
        imageUrl:
          type: string
        stockQuantity:
          type: integer
        lowStockThreshold:
          type: integer
        price:
          type: string
        category:
          type: object
          properties:
            name:
              type: string
        brand:
          type: object
          properties:
            name:
              type: string

    InventoryLog:
      type: object
      properties:
        id:
          type: string
        productId:
          type: string
        adjustmentType:
          type: string
          enum: [RECEIVED, SOLD, RETURNED, DAMAGED, ADJUSTMENT, TRANSFER]
        quantity:
          type: integer
        previousQty:
          type: integer
        newQty:
          type: integer
        reason:
          type: string
        referenceId:
          type: string
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time

    CreateInventoryAdjustmentRequest:
      type: object
      required: [productId, adjustmentType, quantity]
      properties:
        productId:
          type: string
        adjustmentType:
          type: string
          enum: [RECEIVED, SOLD, RETURNED, DAMAGED, ADJUSTMENT, TRANSFER]
        quantity:
          type: integer
        reason:
          type: string
        referenceId:
          type: string

    InventoryAdjustmentResponse:
      type: object
      properties:
        product:
          type: object
          properties:
            id:
              type: string
            stockQuantity:
              type: integer
        log:
          $ref: '#/components/schemas/InventoryLog'

    ImportResult:
      type: object
      properties:
        success:
          type: boolean
        created:
          type: integer
        updated:
          type: integer
        skipped:
          type: integer
        errors:
          type: array
          items:
            type: object
            properties:
              row:
                type: integer
              message:
                type: string

    # Dropship Schemas
    AffiliateOrderStatus:
      type: string
      enum: [PENDING, SENT, CONFIRMED, FAILED, CANCELLED]

    AffiliateOrder:
      type: object
      properties:
        id:
          type: string
        orderId:
          type: string
        affiliateId:
          type: string
        status:
          $ref: '#/components/schemas/AffiliateOrderStatus'
        externalOrderId:
          type: string
        lastError:
          type: string
        retryCount:
          type: integer
        nextRetryAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        order:
          $ref: '#/components/schemas/OrderSummary'
        affiliate:
          $ref: '#/components/schemas/Affiliate'

    Affiliate:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        code:
          type: string
        baseUrl:
          type: string
        isActive:
          type: boolean
        retryPolicy:
          type: object
        createdAt:
          type: string
          format: date-time

    CreateAffiliateRequest:
      type: object
      required: [name, code, baseUrl, apiKey]
      properties:
        name:
          type: string
        code:
          type: string
        baseUrl:
          type: string
        apiKey:
          type: string
        apiSecret:
          type: string
        isActive:
          type: boolean
        retryPolicy:
          type: object

    UpdateAffiliateRequest:
      type: object
      properties:
        name:
          type: string
        baseUrl:
          type: string
        apiKey:
          type: string
        apiSecret:
          type: string
        isActive:
          type: boolean
        retryPolicy:
          type: object

    # Address Schemas
    Address:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        label:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        street:
          type: string
        apartment:
          type: string
        city:
          type: string
        state:
          type: string
        zipCode:
          type: string
        country:
          type: string
        phone:
          type: string
        isDefault:
          type: boolean

    CreateAddressRequest:
      type: object
      required: [firstName, lastName, street, city, state, zipCode]
      properties:
        label:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        street:
          type: string
        apartment:
          type: string
        city:
          type: string
        state:
          type: string
        zipCode:
          type: string
        country:
          type: string
          default: US
        phone:
          type: string
        isDefault:
          type: boolean

    UpdateAddressRequest:
      type: object
      properties:
        label:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        street:
          type: string
        apartment:
          type: string
        city:
          type: string
        state:
          type: string
        zipCode:
          type: string
        country:
          type: string
        phone:
          type: string
        isDefault:
          type: boolean

    # Settings Schemas
    Setting:
      type: object
      properties:
        id:
          type: string
        key:
          type: string
        value: {}
        category:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # Audit Schemas
    AuditLog:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        action:
          type: string
        resource:
          type: string
        resourceId:
          type: string
        oldData:
          type: object
        newData:
          type: object
        ipAddress:
          type: string
        userAgent:
          type: string
        createdAt:
          type: string
          format: date-time
        user:
          type: object
          properties:
            id:
              type: string
            email:
              type: string
            name:
              type: string

    AuditStatistics:
      type: object
      properties:
        todayCount:
          type: integer
        weekCount:
          type: integer
        byAction:
          type: array
          items:
            type: object
            properties:
              action:
                type: string
              count:
                type: integer
        byResource:
          type: array
          items:
            type: object
            properties:
              resource:
                type: string
              count:
                type: integer

    # Report Schemas
    SalesReport:
      type: object
      properties:
        period:
          type: string
        totalSales:
          type: number
        orderCount:
          type: integer
        averageOrderValue:
          type: number
        data:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
              sales:
                type: number
              orders:
                type: integer

    CategoryReport:
      type: object
      properties:
        totalSales:
          type: number
        data:
          type: array
          items:
            type: object
            properties:
              categoryId:
                type: string
              categoryName:
                type: string
              sales:
                type: number
              percentage:
                type: number

    InventoryValueReport:
      type: object
      properties:
