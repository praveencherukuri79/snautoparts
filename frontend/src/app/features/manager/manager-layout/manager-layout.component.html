<div class="min-h-screen bg-background flex">
  <!-- Sidebar -->
  <aside 
    class="fixed inset-y-0 left-0 z-50 w-64 bg-footer-bg text-footer-text transform transition-transform lg:translate-x-0 lg:static lg:inset-auto"
    [class.-translate-x-full]="!sidebarOpen()"
    [class.translate-x-0]="sidebarOpen()">
    
    <!-- Logo -->
    <div class="h-16 flex items-center justify-between px-4 border-b border-footer-border">
      <a routerLink="/" class="flex items-center">
        <img src="assets/images/SN_logo_small-1.png" alt="SN Auto Parts" class="h-10 w-auto brightness-110">
      </a>
      <button (click)="toggleSidebar()" type="button" class="lg:hidden text-footer-muted hover:text-primary-contrast">
        <app-icon name="close" [size]="24"></app-icon>
      </button>
    </div>

    <!-- Navigation -->
    <nav class="p-4 space-y-1">
      <p class="px-3 py-2 text-xs font-semibold text-footer-muted uppercase tracking-wider">
        Management
      </p>
      @for (item of navItems; track item.path) {
        <a 
          [routerLink]="item.path"
          routerLinkActive="bg-primary text-primary-contrast"
          [routerLinkActiveOptions]="{ exact: item.path === '/manager/orders' }"
          class="flex items-center gap-3 px-3 py-2 rounded-lg text-footer-text hover:bg-footer-border hover:text-primary-contrast transition-colors">
          <app-icon [name]="item.icon" [size]="20"></app-icon>
          {{ item.label }}
        </a>
      }

      <hr class="my-4 border-footer-border">
      
      <a routerLink="/" class="flex items-center gap-3 px-3 py-2 rounded-lg text-footer-text hover:bg-footer-border hover:text-primary-contrast transition-colors">
        <app-icon name="storefront" [size]="20"></app-icon>
        View Store
      </a>

      @if (userRole() === 'ADMIN') {
        <a routerLink="/admin" class="flex items-center gap-3 px-3 py-2 rounded-lg text-footer-text hover:bg-footer-border hover:text-primary-contrast transition-colors">
          <app-icon name="admin_panel_settings" [size]="20"></app-icon>
          Admin Panel
        </a>
      }
    </nav>

    <!-- User Info -->
    <div class="absolute bottom-0 left-0 right-0 p-4 border-t border-footer-border">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-full bg-primary/20 flex items-center justify-center">
            <app-icon name="person" [size]="20" class="text-primary"></app-icon>
          </div>
          <div>
            <p class="text-sm font-medium">{{ user()?.firstName }} {{ user()?.lastName }}</p>
            <p class="text-xs text-footer-muted">{{ userRole() }}</p>
          </div>
        </div>
        <button (click)="logout()" type="button" class="p-2 text-footer-muted hover:text-primary-contrast" title="Logout">
          <app-icon name="logout" [size]="20"></app-icon>
        </button>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <div class="flex-1 flex flex-col min-w-0">
    <!-- Top Bar -->
    <header class="h-16 bg-surface border-b border-border flex items-center px-4 lg:px-6">
      <button (click)="toggleSidebar()" type="button" class="lg:hidden p-2 text-text-muted hover:text-text">
        <app-icon name="menu" [size]="24"></app-icon>
      </button>
      <div class="ml-auto flex items-center gap-4">
        <button type="button" class="p-2 text-text-muted hover:text-text relative">
          <app-icon name="notifications" [size]="22"></app-icon>
          <span class="absolute top-1 right-1 w-2 h-2 bg-error rounded-full"></span>
        </button>
      </div>
    </header>

    <!-- Page Content -->
    <main class="flex-1 p-4 lg:p-6 overflow-auto">
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- Mobile Overlay -->
  @if (sidebarOpen()) {
    <div 
      (click)="toggleSidebar()"
      class="lg:hidden fixed inset-0 bg-overlay z-40">
    </div>
  }
</div>
