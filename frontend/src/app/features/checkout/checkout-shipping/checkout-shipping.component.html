<div class="bg-surface rounded-2xl border border-border p-6">
  <h2 class="text-xl font-semibold text-text mb-6">
    {{ content.checkout.shipping.title }}
  </h2>

  @if (loading()) {
    <app-loading-spinner [height]="200"></app-loading-spinner>
  } @else {
    <div class="space-y-4">
      @for (method of shippingMethods(); track method.id) {
        <button
          (click)="selectMethod(method.id)"
          type="button"
          class="w-full text-left p-4 rounded-xl border-2 transition-colors"
          [ngClass]="{
            'border-primary bg-primary-light': selectedMethodId() === method.id,
            'border-border': selectedMethodId() !== method.id
          }">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-4">
              <div 
                class="w-5 h-5 rounded-full border-2 flex items-center justify-center"
                [ngClass]="{
                  'border-primary': selectedMethodId() === method.id,
                  'border-border-strong': selectedMethodId() !== method.id
                }">
                @if (selectedMethodId() === method.id) {
                  <div class="w-3 h-3 rounded-full bg-primary"></div>
                }
              </div>
              <div>
                <div class="flex items-center gap-2">
                  <p class="font-medium text-text">{{ method.name }}</p>
                  @if (isFreeShipping(method)) {
                    <span class="badge badge-success">Free!</span>
                  }
                </div>
                <p class="text-sm text-text-muted">{{ method.description }}</p>
              </div>
            </div>
            <div class="text-right">
              @if (isFreeShipping(method)) {
                <p class="font-semibold text-success">FREE</p>
                <p class="text-sm text-text-muted opacity-70 line-through">{{ method.price | currency }}</p>
              } @else {
                <p class="font-semibold text-text">{{ method.price | currency }}</p>
              }
            </div>
          </div>
        </button>
      }
    </div>

    <!-- Free Shipping Banner -->
    @if (subtotal() < 75) {
      <div class="mt-6 p-4 bg-primary-light rounded-lg">
        <div class="flex items-center gap-2 text-primary">
          <app-icon name="local_shipping" [size]="20"></app-icon>
          <span class="text-sm font-medium">
            Add {{ (75 - subtotal()) | currency }} more to qualify for free standard shipping!
          </span>
        </div>
      </div>
    }

    <!-- Navigation Buttons -->
    <div class="mt-8 flex gap-4">
      <button
        (click)="goBack()"
        type="button"
        class="btn btn-secondary btn-lg flex-1">
        <app-icon name="arrow_back" [size]="18"></app-icon>
        {{ content.common.back }}
      </button>
      <button
        (click)="continue()"
        type="button"
        class="btn btn-primary btn-lg flex-1"
        [disabled]="!selectedMethodId()">
        {{ content.checkout.shipping.continue }}
        <app-icon name="arrow_forward" [size]="18"></app-icon>
      </button>
    </div>
  }
</div>
