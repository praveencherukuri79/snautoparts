<div class="w-full max-w-[480px]">
  <div class="mb-8">
    <h1 class="text-3xl md:text-4xl font-black mb-2">Create an Account</h1>
    <p class="text-[var(--color-text-muted)]">Join the SN Auto Parts family today.</p>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-5">
    <div class="grid grid-cols-2 gap-4">
      <app-input
        label="First Name"
        placeholder="John"
        formControlName="firstName"
        [error]="getError('firstName')"
        autocomplete="given-name"
      ></app-input>
      <app-input
        label="Last Name"
        placeholder="Doe"
        formControlName="lastName"
        [error]="getError('lastName')"
        autocomplete="family-name"
      ></app-input>
    </div>

    <app-input
      label="Email Address"
      type="email"
      placeholder="name@example.com"
      formControlName="email"
      [error]="getError('email')"
      autocomplete="email"
    ></app-input>

    <app-input
      label="Password"
      type="password"
      placeholder="At least 8 characters"
      formControlName="password"
      [error]="getError('password')"
      autocomplete="new-password"
    ></app-input>

    <app-input
      label="Confirm Password"
      type="password"
      placeholder="Confirm your password"
      formControlName="confirmPassword"
      [error]="getError('confirmPassword')"
      autocomplete="new-password"
    ></app-input>

    <app-button
      variant="primary"
      type="submit"
      [fullWidth]="true"
      [loading]="isLoading()"
      icon="person_add"
    >
      Create Account
    </app-button>
  </form>

  <p class="mt-8 text-center text-sm text-[var(--color-text-muted)]">
    Already have an account?
    <a routerLink="/login" class="text-[var(--color-primary)] font-semibold ml-1 hover:text-[var(--color-text)]">
      Sign in
    </a>
  </p>
</div>
