<div class="products-list">
  <div class="page-header">
    <h1>Products</h1>
    <app-button icon="add" routerLink="/admin/products/new">
      Add Product
    </app-button>
  </div>

  <app-data-table
    [columns]="columns"
    [data]="products()"
    [loading]="isLoading()"
    [paginated]="true"
    [total]="total()"
    [pageSize]="pageSize"
    [currentPage]="currentPage()"
    (pageChange)="onPageChange($event)"
    (rowClick)="navigateToProduct($event)"
    emptyTitle="No products found"
    emptyMessage="Start by adding your first product"
  />
</div>
