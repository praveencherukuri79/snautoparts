<app-header></app-header>

<main class="flex-1 bg-background">
  <div class="container mx-auto px-4 py-8">
    <h1 class="text-2xl md:text-3xl font-bold text-text mb-8">
      {{ content.account.title }}
    </h1>

    <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
      <!-- Sidebar -->
      <aside class="lg:col-span-1">
        <nav class="bg-surface rounded-2xl border border-border overflow-hidden">
          <a routerLink="/account" routerLinkActive="bg-primary-light text-primary border-l-4 border-primary" [routerLinkActiveOptions]="{ exact: true }"
             class="flex items-center gap-3 px-4 py-3 text-text-secondary hover:bg-surface-hover">
            <app-icon name="person" [size]="20"></app-icon>
            {{ content.account.profile.title }}
          </a>
          <a routerLink="/account/addresses" routerLinkActive="bg-primary-light text-primary border-l-4 border-primary"
             class="flex items-center gap-3 px-4 py-3 text-text-secondary hover:bg-surface-hover">
            <app-icon name="location_on" [size]="20"></app-icon>
            {{ content.account.addresses.title }}
          </a>
          <a routerLink="/orders" 
             class="flex items-center gap-3 px-4 py-3 text-text-secondary hover:bg-surface-hover">
            <app-icon name="receipt_long" [size]="20"></app-icon>
            {{ content.account.orders.title }}
          </a>
        </nav>
      </aside>

      <!-- Main Content -->
      <div class="lg:col-span-3 space-y-6">
        <!-- Success/Error Messages -->
        @if (success()) {
          <div class="alert alert-success">
            <p class="text-sm flex items-center gap-2">
              <app-icon name="check_circle" [size]="18"></app-icon>
              {{ success() }}
            </p>
          </div>
        }
        @if (error()) {
          <div class="alert alert-error">
            <p class="text-sm flex items-center gap-2">
              <app-icon name="error" [size]="18"></app-icon>
              {{ error() }}
            </p>
          </div>
        }

        <!-- Personal Information -->
        <div class="bg-surface rounded-2xl border border-border p-6">
          <h2 class="text-lg font-semibold text-text mb-6">
            {{ content.account.profile.personalInfo }}
          </h2>
          <form [formGroup]="profileForm" (ngSubmit)="updateProfile()" class="space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium text-text-secondary mb-1">
                  {{ content.account.profile.firstName }}
                </label>
                <input
                  type="text"
                  formControlName="firstName"
                  class="w-full px-4 py-3 rounded-lg ui-input"
                >
              </div>
              <div>
                <label class="block text-sm font-medium text-text-secondary mb-1">
                  {{ content.account.profile.lastName }}
                </label>
                <input
                  type="text"
                  formControlName="lastName"
                  class="w-full px-4 py-3 rounded-lg ui-input"
                >
              </div>
            </div>
            <div>
              <label class="block text-sm font-medium text-text-secondary mb-1">
                {{ content.account.profile.email }}
              </label>
              <input
                type="email"
                formControlName="email"
                class="w-full px-4 py-3 rounded-lg ui-input bg-surface-subtle text-text-muted cursor-not-allowed"
                [disabled]="true"
              >
            </div>
            <div>
              <label class="block text-sm font-medium text-text-secondary mb-1">
                {{ content.account.profile.phone }}
              </label>
              <input
                type="tel"
                formControlName="phone"
                placeholder="(555) 123-4567"
                class="w-full px-4 py-3 rounded-lg ui-input"
              >
            </div>
            <button
              type="submit"
              class="btn btn-primary btn-md"
              [disabled]="profileForm.invalid || saving()">
              @if (saving()) {
                <div class="spinner w-4 h-4"></div>
              }
              {{ content.account.profile.update }}
            </button>
          </form>
        </div>

        <!-- Change Password -->
        <div class="bg-surface rounded-2xl border border-border p-6">
          <h2 class="text-lg font-semibold text-text mb-6">
            {{ content.account.profile.changePassword }}
          </h2>
          <form [formGroup]="passwordForm" (ngSubmit)="changePassword()" class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-text-secondary mb-1">
                {{ content.account.profile.currentPassword }}
              </label>
              <input
                type="password"
                formControlName="currentPassword"
                class="w-full px-4 py-3 rounded-lg ui-input"
              >
            </div>
            <div>
              <label class="block text-sm font-medium text-text-secondary mb-1">
                {{ content.account.profile.newPassword }}
              </label>
              <input
                type="password"
                formControlName="newPassword"
                class="w-full px-4 py-3 rounded-lg ui-input"
              >
            </div>
            <div>
              <label class="block text-sm font-medium text-text-secondary mb-1">
                {{ content.account.profile.confirmPassword }}
              </label>
              <input
                type="password"
                formControlName="confirmPassword"
                class="w-full px-4 py-3 rounded-lg ui-input"
              >
            </div>
            <button
              type="submit"
              class="btn btn-secondary btn-md"
              [disabled]="passwordForm.invalid || saving()">
              @if (saving()) {
                <div class="spinner w-4 h-4"></div>
              }
              {{ content.account.profile.changePassword }}
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</main>

<app-footer></app-footer>
