<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Inventory Adjustment Modal</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f97415",
                        "background-light": "#f8f7f5",
                        "background-dark": "#23170f",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
</head>
<body class="font-display bg-background-light dark:bg-background-dark text-[#181411] dark:text-white overflow-hidden h-screen w-screen relative">
<!-- Blurred Background Context (Simulating the Manager Dashboard underneath) -->
<div aria-hidden="true" class="absolute inset-0 z-0 flex flex-col blur-[2px] opacity-40 pointer-events-none select-none overflow-hidden">
<!-- Fake Header -->
<header class="h-16 border-b border-[#e6dfdb] dark:border-gray-700 bg-white dark:bg-[#2a1c13] flex items-center px-8 gap-4">
<div class="w-8 h-8 bg-primary rounded"></div>
<div class="h-4 w-32 bg-gray-200 dark:bg-gray-700 rounded"></div>
<div class="flex-1"></div>
<div class="w-10 h-10 rounded-full bg-gray-200 dark:bg-gray-700"></div>
</header>
<!-- Fake Content -->
<div class="flex-1 p-8">
<div class="h-8 w-64 bg-gray-200 dark:bg-gray-700 rounded mb-8"></div>
<div class="w-full bg-white dark:bg-[#2a1c13] border border-[#e6dfdb] dark:border-gray-700 rounded-lg h-[600px] p-6">
<div class="flex justify-between mb-6">
<div class="h-10 w-48 bg-gray-100 dark:bg-gray-800 rounded"></div>
<div class="h-10 w-32 bg-primary/20 rounded"></div>
</div>
<div class="space-y-4">
<div class="h-12 w-full bg-gray-50 dark:bg-gray-800/50 rounded border-b border-gray-100 dark:border-gray-800"></div>
<div class="h-12 w-full bg-gray-50 dark:bg-gray-800/50 rounded border-b border-gray-100 dark:border-gray-800"></div>
<div class="h-12 w-full bg-gray-50 dark:bg-gray-800/50 rounded border-b border-gray-100 dark:border-gray-800"></div>
</div>
</div>
</div>
</div>
<!-- Modal Overlay -->
<div class="absolute inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4 animate-fade-in">
<!-- Modal Container -->
<div class="w-full max-w-[640px] flex flex-col bg-white dark:bg-[#2a1c13] rounded-xl shadow-2xl overflow-hidden max-h-[90vh]">
<!-- Modal Header -->
<div class="flex items-center justify-between px-6 py-5 border-b border-[#e6dfdb] dark:border-gray-700">
<div class="flex flex-col gap-1">
<h2 class="text-xl font-bold tracking-tight text-[#181411] dark:text-white">Adjust Stock</h2>
<p class="text-sm text-[#8c725f] dark:text-gray-400">Brake Pads - Ceramic (SKU: BP-992)</p>
</div>
<button class="p-2 text-[#8c725f] hover:text-[#181411] dark:text-gray-400 dark:hover:text-white transition-colors rounded-full hover:bg-[#f8f7f5] dark:hover:bg-white/10">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Modal Scrollable Content -->
<div class="flex-1 overflow-y-auto px-6 py-6 custom-scrollbar">
<!-- Current Stats Section -->
<div class="mb-6 p-4 bg-[#f8f7f5] dark:bg-white/5 rounded-lg border border-[#e6dfdb] dark:border-gray-700 flex items-center justify-between">
<div class="flex flex-col">
<span class="text-sm font-medium text-[#8c725f] dark:text-gray-400">Current On-Hand</span>
<span class="text-2xl font-bold text-[#181411] dark:text-white">5 units</span>
</div>
<div class="h-10 w-10 rounded-full bg-primary/10 flex items-center justify-center text-primary">
<span class="material-symbols-outlined">inventory_2</span>
</div>
</div>
<form class="flex flex-col gap-6">
<!-- Adjustment Type -->
<div class="flex flex-col gap-2">
<label class="text-sm font-medium text-[#181411] dark:text-gray-200" for="adjustment-type">Adjustment Type</label>
<div class="relative">
<select class="w-full h-12 pl-4 pr-10 bg-white dark:bg-[#23170f] border border-[#e6dfdb] dark:border-gray-700 rounded-lg text-[#181411] dark:text-white focus:ring-2 focus:ring-primary focus:border-transparent outline-none appearance-none transition-all cursor-pointer" id="adjustment-type">
<option disabled="" selected="" value="">Select reason category</option>
<option value="received">Received (Restock)</option>
<option value="count">Inventory Count (Correction)</option>
<option value="damage">Damaged / Expired</option>
<option value="return">Customer Return</option>
<option value="other">Other</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-[#8c725f] pointer-events-none">expand_more</span>
</div>
</div>
<!-- Quantity & Date Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- Quantity Change with Stepper -->
<div class="flex flex-col gap-2">
<label class="text-sm font-medium text-[#181411] dark:text-gray-200">Quantity Change</label>
<div class="flex items-center gap-2">
<button class="h-12 w-12 flex items-center justify-center rounded-lg border border-[#e6dfdb] dark:border-gray-700 hover:bg-[#f8f7f5] dark:hover:bg-white/10 text-[#181411] dark:text-white transition-colors active:scale-95" type="button">
<span class="material-symbols-outlined">remove</span>
</button>
<input class="flex-1 h-12 text-center bg-white dark:bg-[#23170f] border border-[#e6dfdb] dark:border-gray-700 rounded-lg text-[#181411] dark:text-white font-semibold focus:ring-2 focus:ring-primary focus:border-transparent outline-none appearance-none" placeholder="0" type="number" value="0"/>
<button class="h-12 w-12 flex items-center justify-center rounded-lg border border-[#e6dfdb] dark:border-gray-700 hover:bg-[#f8f7f5] dark:hover:bg-white/10 text-[#181411] dark:text-white transition-colors active:scale-95" type="button">
<span class="material-symbols-outlined">add</span>
</button>
</div>
<p class="text-xs text-[#8c725f] dark:text-gray-400 pl-1">New total will be: <strong>5 units</strong></p>
</div>
<!-- Date Picker -->
<div class="flex flex-col gap-2">
<label class="text-sm font-medium text-[#181411] dark:text-gray-200" for="adjustment-date">Date of Adjustment</label>
<div class="relative">
<input class="w-full h-12 pl-4 pr-4 bg-white dark:bg-[#23170f] border border-[#e6dfdb] dark:border-gray-700 rounded-lg text-[#181411] dark:text-white focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all placeholder-[#8c725f]" id="adjustment-date" type="date" value="2023-10-27"/>
</div>
</div>
</div>
<!-- Reason Textarea -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-baseline">
<label class="text-sm font-medium text-[#181411] dark:text-gray-200" for="reason">Reason for Adjustment</label>
<span class="text-xs text-primary font-medium">Required</span>
</div>
<textarea class="w-full p-4 bg-white dark:bg-[#23170f] border border-[#e6dfdb] dark:border-gray-700 rounded-lg text-[#181411] dark:text-white focus:ring-2 focus:ring-primary focus:border-transparent outline-none resize-none transition-all" id="reason" placeholder="Briefly explain the inventory discrepancy (e.g. 'Found damaged box in aisle 4')..." rows="3"></textarea>
</div>
</form>
</div>
<!-- Modal Footer -->
<div class="px-6 py-5 bg-[#f8f7f5] dark:bg-white/5 border-t border-[#e6dfdb] dark:border-gray-700 flex justify-end gap-3">
<button class="px-5 h-11 rounded-lg border border-[#e6dfdb] dark:border-gray-600 font-medium text-[#181411] dark:text-white hover:bg-gray-100 dark:hover:bg-white/10 transition-colors focus:ring-2 focus:ring-gray-200" type="button">
                    Cancel
                </button>
<button class="px-5 h-11 rounded-lg bg-primary text-white font-semibold hover:bg-[#d66312] transition-colors shadow-sm flex items-center gap-2 focus:ring-2 focus:ring-offset-2 focus:ring-primary dark:ring-offset-[#2a1c13]" type="button">
<span class="material-symbols-outlined text-[20px]">check</span>
                    Save Adjustment
                </button>
</div>
</div>
</div>
</body></html>
