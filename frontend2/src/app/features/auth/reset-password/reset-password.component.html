<div class="reset-password">
  <div class="reset-password__header">
    <h1 class="reset-password__title">Reset Password</h1>
    <p class="reset-password__subtitle">Enter your new password below.</p>
  </div>

  @if (!token()) {
    <div class="reset-password__error">
      <span class="material-symbols-outlined">error</span>
      <p>Invalid or missing reset token.</p>
      <a routerLink="/forgot-password" class="reset-password__link">Request a new reset link</a>
    </div>
  } @else {
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="reset-password__form">
      <app-input
        label="New Password"
        type="password"
        placeholder="At least 8 characters"
        formControlName="password"
        [error]="getError('password')"
        autocomplete="new-password"
      ></app-input>

      <app-input
        label="Confirm Password"
        type="password"
        placeholder="Confirm your password"
        formControlName="confirmPassword"
        [error]="getError('confirmPassword')"
        autocomplete="new-password"
      ></app-input>

      <app-button
        variant="primary"
        type="submit"
        [fullWidth]="true"
        [loading]="isLoading()"
        icon="lock_reset"
      >
        Reset Password
      </app-button>
    </form>
  }
</div>
