<div class="data-table-container">
  @if (loading) {
    <div class="data-table__loading">
      <app-spinner size="lg" />
    </div>
  } @else if (data.length === 0) {
    <app-empty-state
      [icon]="emptyIcon"
      [title]="emptyTitle"
      [message]="emptyMessage"
    />
  } @else {
    <div class="data-table__wrapper">
      <table mat-table [dataSource]="data" matSort (matSortChange)="onSort($event)">
        <!-- Selection Column -->
        @if (selectable) {
          <ng-container matColumnDef="select">
            <th mat-header-cell *matHeaderCellDef>
              <mat-checkbox
                [checked]="isAllSelected()"
                [indeterminate]="isIndeterminate()"
                (change)="toggleAll()"
              />
            </th>
            <td mat-cell *matCellDef="let row">
              <mat-checkbox
                [checked]="selection.isSelected(row)"
                (change)="toggleRow(row)"
                (click)="$event.stopPropagation()"
              />
            </td>
          </ng-container>
        }

        <!-- Data Columns -->
        @for (column of columns; track column.key) {
          <ng-container [matColumnDef]="column.key">
            <th 
              mat-header-cell 
              *matHeaderCellDef 
              [mat-sort-header]="column.sortable ? column.key : ''"
              [disabled]="!column.sortable"
              [style.width]="column.width"
              [style.text-align]="column.align || 'left'"
            >
              {{ column.label }}
            </th>
            <td 
              mat-cell 
              *matCellDef="let row"
              [style.text-align]="column.align || 'left'"
            >
              @if (column.template) {
                <ng-container 
                  [ngTemplateOutlet]="column.template" 
                  [ngTemplateOutletContext]="{ $implicit: row, column: column }"
                />
              } @else {
                {{ row[column.key] }}
              }
            </td>
          </ng-container>
        }

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr 
          mat-row 
          *matRowDef="let row; columns: displayedColumns" 
          (click)="onRowClick(row)"
          class="data-table__row"
        ></tr>
      </table>
    </div>

    @if (paginated && total > pageSize) {
      <app-pagination
        [total]="total"
        [pageSize]="pageSize"
        [currentPage]="currentPage"
        (pageChange)="onPageChange($event)"
        (pageSizeChange)="onPageSizeChange($event)"
      />
    }
  }
</div>
