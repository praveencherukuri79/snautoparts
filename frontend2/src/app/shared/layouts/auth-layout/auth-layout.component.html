<div class="auth-layout">
  <!-- Left Side: Hero Image (Hidden on mobile) -->
  <div class="auth-layout__hero">
    <div class="auth-layout__hero-overlay"></div>
    <div class="auth-layout__hero-content">
      <h1 class="auth-layout__hero-title">
        Performance<br />starts here.
      </h1>
      <p class="auth-layout__hero-subtitle">
        Join over 50,000 gearheads who trust SN Auto Parts for their restoration and performance needs.
      </p>
      <div class="auth-layout__hero-features">
        <div class="auth-layout__hero-feature">
          <span class="material-symbols-outlined">verified</span>
          Quality Guaranteed
        </div>
        <div class="auth-layout__hero-feature">
          <span class="material-symbols-outlined">local_shipping</span>
          Fast Shipping
        </div>
      </div>
    </div>
  </div>

  <!-- Right Side: Auth Content -->
  <div class="auth-layout__content">
    <!-- Header -->
    <header class="auth-layout__header">
      <a routerLink="/" class="auth-layout__brand">
        <span class="auth-layout__brand-icon material-symbols-outlined">directions_car</span>
        <span class="auth-layout__brand-name">SN Auto Parts</span>
      </a>
      <a routerLink="/" class="auth-layout__back-link">
        <span class="material-symbols-outlined">arrow_back</span>
        Return to Shop
      </a>
    </header>

    <!-- Form Container -->
    <main class="auth-layout__main">
      <router-outlet></router-outlet>
    </main>

    <!-- Footer -->
    <footer class="auth-layout__footer">
      <a href="#">Privacy Policy</a>
      <a href="#">Terms of Service</a>
    </footer>
  </div>
</div>
